name: Unpublish placeholder

on:
  workflow_dispatch:

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove 0.0.0-stage placeholder version
        run: npm unpublish @m3ow-dev/opencode-llama-cpp@0.0.0-stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}