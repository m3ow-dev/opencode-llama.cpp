name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., patch, minor, major, or specific version like 0.4.0)'
        required: true
        type: string
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup pnpm
        # Version comes from packageManager in package.json (pnpm@10.33.0).
        # Pinned to v10: pnpm 11 defaults minimumReleaseAge to 24h, which
        # rejects same-day dependency releases (including our own
        # @opencode/* deps). The lockfile is generated with pnpm 10.
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install latest npm for trusted publishing (OIDC)
        # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
        run: npm install -g npm@latest
      
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm run test:run
      
      - name: Build
        run: pnpm run typecheck
      
      - name: Bump version
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      
      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to v${{ env.NEW_VERSION }}"
      
      - name: Create git tag
        run: git tag v${{ env.NEW_VERSION }}
      
      - name: Push commits and tags
        run: |
          git push origin main
          git push origin v${{ env.NEW_VERSION }}
      
      - name: Create GitHub release
        run: gh release create v${{ env.NEW_VERSION }} --generate-notes --title "v${{ env.NEW_VERSION }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to npm via trusted publishing (OIDC)
        # No NODE_AUTH_TOKEN: npm >=11 exchanges this job's OIDC token
        # (permissions.id-token: write) for a short-lived registry token,
        # as configured in the package's trusted publishing settings on npmjs.com.
        run: npm publish --access public
